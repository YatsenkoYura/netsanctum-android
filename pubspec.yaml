name: netoutpost
description: NetOutpost Offline Companion App for NetSanctum.
version: 1.5.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_inappwebview: ^6.1.5
  dio: ^5.7.0
  path_provider: ^2.1.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shelf: ^1.4.1
  connectivity_plus: ^6.0.3
  crypto: ^3.0.7
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  intl: ^0.19.0
  sqflite_common_ffi: ^2.4.2
  webview_cef: ^0.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: system
